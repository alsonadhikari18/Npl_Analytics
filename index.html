pages.overview=()=>{const S=D.summary;$('#page').innerHTML=`<h2>Overview</h2><p class=note>Every figure on this site is calculated from the ball-by-ball files. Super-over deliveries are kept in the data but excluded from match-level analysis.</p>
<div class=cards>${[['Matches',S.matches],['Seasons',S.seasons],['Deliveries',S.deliveries.toLocaleString()],['Runs',S.runs.toLocaleString()],['Wickets',S.wickets]].map(([a,b])=>`<div class=card><b>${b}</b><span>${a}</span></div>`).join('')}</div>
<div class=grid><div><h3>Chasing vs defending, by season</h3><div id=c1></div></div><div><h3>Run rate by phase (runs per over)</h3><div id=c2></div></div></div>
<h3>Toss</h3><div id=ts></div><p class=note>With only ${S.matches} matches, small differences here are likely noise.</p><h3>All matches</h3><div id=mt></div>`;
 plot($('#c1'),[{type:'bar',name:'Chasing team won',x:D.seasons.map(s=>s.season),y:D.seasons.map(s=>s.chase_w),marker:{color:cv('--acc')}},{type:'bar',name:'Team batting first won',x:D.seasons.map(s=>s.season),y:D.seasons.map(s=>s.def_w),marker:{color:cv('--acc2')}}],{barmode:'group',yaxis:{title:'Matches (ties excluded)'}});
 plot($('#c2'),D.phase_rr.map(p=>({type:'bar',name:p.inn==1?'Batting first':'Chasing',x:['Powerplay (1-6)','Middle (7-15)','Death (16-20)'],y:[p.pp,p.mid,p.death]})),{barmode:'group',yaxis:{title:'Runs per over'}});
 table($('#ts'),D.toss,[{k:'decision',t:'Toss winner chose'},{k:'n',t:'Matches'},{k:'tw',t:'Toss winner won',f:(v,r)=>pc(v,r.n)},{k:'chase_w',t:'Chasing team won',f:(v,r)=>pc(v,r.n)}]);
 table($('#mt'),D.matches,[{k:'date',t:'Date'},{k:'stage',t:'Stage'},{k:'fixture',t:'Fixture'},{k:'toss',t:'Toss'},{k:'inn1',t:'1st innings'},{k:'inn2',t:'2nd innings'},{k:'winner',t:'Winner'},{k:'result',t:'Result'}],{sort:'date',desc:false,max:80})};
pages.factors=()=>{$('#page').innerHTML=`<h2>What wins NPL matches?</h2><p class=note>Each match gives one pair: the winning team's innings minus the losing team's innings. The bar shows the average gap with a 95% bootstrap range over matches. If the range crosses zero, the data cannot separate the effect from noise. This shows association, not cause. Wickets lost by the loser are wickets taken by the winner. Tied match excluded (n = ${D.factors[0].n}).</p>
<div id=fp style="height:430px"></div><div id=ft></div>
<p class=note>Caution: when a chase succeeds the winner's innings ends early, so late-phase figures for chasers cover fewer overs. Rates (per over, per ball) are used to limit that, but some bias remains.</p>
<h2 style="margin-top:30px">NPL benchmarks</h2><p class=note>First-innings percentiles, then the win rate of the team batting first (or chasing) within bands. Bars show the win % with a 95% range. Wide ranges mean small samples. These describe what happened in this competition. They are not targets.</p><div id=pc></div><div class=grid id=bg></div>`;
 const F=D.factors;plot($('#fp'),[{type:'scatter',mode:'markers',x:F.map(r=>r.diff),y:F.map(r=>r.label),marker:{size:10,color:F.map(r=>r.lo>0||r.hi<0?cv('--acc'):cv('--mut'))},error_x:{type:'data',symmetric:false,array:F.map(r=>r.hi-r.diff),arrayminus:F.map(r=>r.diff-r.lo),color:cv('--mut')},hovertemplate:'%{y}: %{x:.2f}<extra></extra>'}],
 {xaxis:{title:'Winner minus loser (average per match)',zeroline:true,zerolinecolor:cv('--fg')},yaxis:{autorange:'reversed'},margin:{l:210,r:20,t:10,b:50}});
 table($('#ft'),F,[{k:'label',t:'Metric'},{k:'win',t:'Winners avg',f:v=>f(v,2)},{k:'loss',t:'Losers avg',f:v=>f(v,2)},{k:'diff',t:'Gap',f:v=>f(v,2)},{k:'lo',t:'95% low',f:v=>f(v,2)},{k:'hi',t:'95% high',f:v=>f(v,2)},{k:'n',t:'Matches'},{k:'dz',t:'Effect size',f:v=>f(v,2)},
 {k:'k',t:'Verdict',f:(v,r)=>r.lo>0||r.hi<0?'<span class=good>Clear gap</span>':'<span class=warn>Not clear</span>'}],{max:20});
 table($('#pc'),D.pct,[{k:'metric',t:'1st innings'},{k:'p10',t:'P10',f:v=>f(v,0)},{k:'p25',t:'P25',f:v=>f(v,0)},{k:'p50',t:'Median',f:v=>f(v,0)},{k:'p75',t:'P75',f:v=>f(v,0)},{k:'p90',t:'P90',f:v=>f(v,0)},{k:'n',t:'Innings'}]);
 const B=D.bench,T=[['total',"Batting first: win % by total"],['pp_runs','Batting first: win % by powerplay runs'],['pp_wkts','Batting first: win % by powerplay wickets lost'],['mid_rr','Batting first: win % by middle-overs run rate'],['death_rr','Batting first: win % by death-overs run rate'],['target','Chasing: win % by target set']];
 $('#bg').innerHTML=T.map(t=>`<div id="b_${t[0]}"></div>`).join('');T.forEach(t=>winBars($('#b_'+t[0]),B[t[0]],t[1]))};
const M=[['bat_pp_rr','Powerplay scoring rate',1],['bat_mid_rr','Middle-overs scoring rate',1],['bat_death_rr','Death-overs scoring rate',1],['bat_pp_wpo','Powerplay wickets lost per over',-1],['bat_mid_wpo','Middle-overs wickets lost per over',-1],['bat_death_wpo','Death-overs wickets lost per over',-1],['bat_dotp','Batting dot-ball %',-1],['bat_bnd','Batting boundary-ball %',1],
 ['bowl_pp_econ','Powerplay economy',-1],['bowl_mid_econ','Middle-overs economy',-1],['bowl_death_econ','Death-overs economy',-1],['bowl_pp_wpo','Powerplay wickets per over',1],['bowl_mid_wpo','Middle-overs wickets per over',1],['bowl_death_wpo','Death-overs wickets per over',1],['bowl_dotp','Bowling dot-ball %',1],['bowl_bnd','Boundary-ball % conceded',-1],['bowl_extras','Extras conceded per over',-1]];
const H={bat_pp_wpo:'Attack the new ball: full, swinging lengths to take early wickets.',bat_pp_rr:'Restrict powerplay scoring with a defensive field and a disciplined opening bowler.',bat_mid_rr:'Slow the middle overs with control bowlers.',bat_death_rr:'Hold the best death bowler back.',bat_dotp:'Build dot-ball pressure early.',bat_death_wpo:'Hold wicket-taking bowlers for the death.',bowl_pp_econ:'Attack their opening bowlers: look to score early.',bowl_mid_econ:'Build a platform and go after their middle-overs bowlers.',bowl_death_econ:'Keep wickets in hand to exploit their death bowling.',bowl_extras:'Be patient: they give away extras.',bowl_pp_wpo:'Their bowlers rarely take powerplay wickets: bat positively.',bowl_dotp:'Rotate strike against their bowlers: they struggle to build dot-ball pressure.'};
const tm=n=>D.teams.find(t=>t.team===n);
pages.teams=()=>{const T=D.teams,nm=T.map(t=>t.team);$('#page').innerHTML=`<h2>Team intelligence</h2><p class=note>Aggregated over every innings the team played in 2 seasons (about ${Math.round(T.reduce((a,t)=>a+t.P,0)/T.length)} matches per team). Differences between teams of under 0.5 runs per over are within normal variation at this sample size.</p><div class=grid><div id=t1></div><div id=t2></div><div id=t3></div><div id=t4></div></div><h3>Records</h3><div id=tt></div>`;
 const ph=[['pp','Powerplay'],['mid','Middle'],['death','Death']];
 plot($('#t1'),ph.map(([k,l])=>({type:'bar',name:l,x:nm,y:T.map(t=>t['bat_'+k+'_rr'])})),{title:{text:'Batting: runs per over',font:{size:13}},barmode:'group'});
 plot($('#t2'),ph.map(([k,l])=>({type:'bar',name:l,x:nm,y:T.map(t=>t['bowl_'+k+'_econ'])})),{title:{text:'Bowling: runs conceded per over',font:{size:13}},barmode:'group'});
 plot($('#t3'),ph.map(([k,l])=>({type:'bar',name:l,x:nm,y:T.map(t=>t['bowl_'+k+'_wpo'])})),{title:{text:'Bowling: wickets taken per over',font:{size:13}},barmode:'group'});
 plot($('#t4'),ph.map(([k,l])=>({type:'bar',name:l,x:nm,y:T.map(t=>t['bat_'+k+'_wpo'])})),{title:{text:'Batting: wickets lost per over',font:{size:13}},barmode:'group'});
 table($('#tt'),T.map(t=>({...t,s:t.by_season.map(s=>s.season+': '+s.W+'/'+s.P).join(' · ')})),[{k:'team',t:'Team'},{k:'P',t:'Played'},{k:'W',t:'Won'},{k:'chase_w',t:'Chasing',f:(v,r)=>pc(v,r.chase_p)},{k:'def_w',t:'Defending',f:(v,r)=>pc(v,r.def_p)},{k:'top_bat_share',t:'Runs from top 2 batters',f:(v,r)=>f(v,0)+'% ('+r.top_bat.join(', ')+')'},{k:'top_bowl_share',t:'Wickets by top 2 bowlers',f:(v,r)=>f(v,0)+'% ('+r.top_bowl.join(', ')+')'},{k:'s',t:'Wins by season'}],{sort:'W'})};
pages.opp=()=>{const T=D.teams;$('#page').innerHTML=`<h2>Opposition intelligence</h2><p class=note>Pick the team you will face. Strengths and weaknesses are ranks among the 8 teams. With about 16 matches each, treat them as pointers for the video analysis, not conclusions. The ideas are hypotheses that need cricket judgement.</p>
<div class=ctl><label>Opposition <select id=os>${T.map(t=>`<option>${t.team}</option>`).join('')}</select></label></div><div id=oo></div>`;
 const go=()=>{const t=tm($('#os').value),R=M.map(([k,l,s])=>{const v=T.map(x=>x[k]),rank=1+v.filter(x=>s>0?x>t[k]:x<t[k]).length;return{k,l,v:t[k],avg:v.reduce((a,b)=>a+b,0)/v.length,rank}}).sort((a,b)=>b.rank-a.rank);
 const li=r=>`<li>${r.l}: <b>${f(r.v,2)}</b> (league avg ${f(r.avg,2)}), rank ${r.rank} of ${T.length}</li>`;
 $('#oo').innerHTML=`<div class=cards><div class=card><b>${t.W}/${t.P}</b><span>won</span></div><div class=card><b>${pc(t.chase_w,t.chase_p)}</b><span>chasing</span></div><div class=card><b>${pc(t.def_w,t.def_p)}</b><span>defending</span></div></div>
 <div class=grid><div class=box><h3 style="margin-top:0">Where they are weakest</h3><ul class=pts>${R.slice(0,5).map(li).join('')}</ul></div><div class=box><h3 style="margin-top:0">Where they are strongest</h3><ul class=pts>${R.slice(-5).reverse().map(li).join('')}</ul></div></div>
 <h3>Possible ways to exploit this</h3><ul class=pts>${R.slice(0,5).filter(r=>H[r.k]).map(r=>`<li><b>${r.l}</b> is a relative weakness. ${H[r.k]}</li>`).join('')||'<li>No clear weakness stands out.</li>'}</ul>
 <h3>Who they depend on</h3><ul class=pts><li>Top 2 run-scorers (${t.top_bat.join(', ')}) made ${f(t.top_bat_share,0)}% of the team's bat runs.</li><li>Top 2 wicket-takers (${t.top_bowl.join(', ')}) took ${f(t.top_bowl_share,0)}% of bowler wickets.</li></ul>`};
 $('#os').onchange=go;go()};
pages.players=()=>{const teams=[...new Set(D.bat.map(p=>p.team))].sort();$('#page').innerHTML=`<h2>Player intelligence</h2><p class=note>Shrunk figures pull small samples toward the league average, so a 20-ball cameo does not outrank a proven player. Roles are analytic labels from batting position and usage, not judgements of ability. Only NPL data is used: no availability, form, price or overseas status.</p>
<div class=ctl><select id=pm><option value=bat>Batters</option><option value=bowl>Bowlers</option></select><select id=pt><option value="">All teams</option>${teams.map(t=>`<option>${t}</option>`).join('')}</select><select id=pr></select><label>Min balls <input id=pb type=number value=60 min=12 style="width:80px"></label><input id=pq placeholder="Search player"></div><div id=pg style="height:380px"></div><div id=ptb></div>`;
 const roles=m=>{const r=[...new Set(D[m].map(p=>p.role.split(' / ')[0]))].sort();$('#pr').innerHTML='<option value="">All roles</option>'+r.map(x=>`<option>${x}</option>`).join('')};roles('bat');
 const go=()=>{const m=$('#pm').value,q=$('#pq').value.toLowerCase(),mb=+$('#pb').value||0;let R=D[m].filter(p=>p.balls>=mb&&(!$('#pt').value||p.team===$('#pt').value)&&(!$('#pr').value||p.role.startsWith($('#pr').value))&&p.name.toLowerCase().includes(q));
 const tt=(m==='bat'?'Shrunk strike rate vs boundary-ball %':'Shrunk economy vs dot-ball %');
 plot($('#pg'),[{type:'scatter',mode:'markers',x:R.map(p=>m==='bat'?p.bnd:p.econ_s),y:R.map(p=>m==='bat'?p.sr_s:p.dotp),text:R.map(p=>p.name+' ('+p.team+')'),marker:{size:R.map(p=>6+Math.sqrt(p.balls)),color:cv('--acc'),opacity:.65},hovertemplate:'%{text}<extra></extra>'}],{title:{text:tt+' (bubble = balls)',font:{size:13}},xaxis:{title:m==='bat'?'Boundary balls %':'Shrunk economy'},yaxis:{title:m==='bat'?'Shrunk strike rate':'Dot-ball %'}});
 table($('#ptb'),R,m==='bat'?[{k:'name',t:'Batter'},{k:'team',t:'Team'},{k:'role',t:'Role (analytic)'},{k:'inns',t:'Inns'},{k:'balls',t:'Balls'},{k:'runs',t:'Runs'},{k:'avg',t:'Avg',f:v=>f(v)},{k:'sr',t:'SR',f:v=>f(v,0)},{k:'sr_s',t:'Shrunk SR',f:v=>f(v,0)},{k:'bnd',t:'Bnd %',f:v=>f(v)},{k:'dotp',t:'Dot %',f:v=>f(v)},{k:'pp_sr',t:'PP SR',f:(v,r)=>f(v,0)+' ('+r.pp_b+')'},{k:'mid_sr',t:'Mid SR',f:(v,r)=>f(v,0)+' ('+r.mid_b+')'},{k:'d_sr',t:'Death SR',f:(v,r)=>f(v,0)+' ('+r.d_b+')'}]:
 [{k:'name',t:'Bowler'},{k:'team',t:'Team'},{k:'role',t:'Role (analytic)'},{k:'mt',t:'Matches'},{k:'balls',t:'Balls'},{k:'wk',t:'Wkts'},{k:'econ',t:'Econ',f:v=>f(v,2)},{k:'econ_s',t:'Shrunk econ',f:v=>f(v,2)},{k:'dotp',t:'Dot %',f:v=>f(v)},{k:'bndp',t:'Bnd % conceded',f:v=>f(v)},{k:'bpw',t:'Balls/wkt',f:v=>f(v,0)},{k:'pp_econ',t:'PP econ',f:(v,r)=>f(v,1)+' ('+r.pp_b+')'},{k:'mid_econ',t:'Mid econ',f:(v,r)=>f(v,1)+' ('+r.mid_b+')'},{k:'d_econ',t:'Death econ',f:(v,r)=>f(v,1)+' ('+r.d_b+')'},{k:'wd',t:'Wides'},{k:'nb',t:'No-balls'}],{sort:m==='bat'?'sr_s':'balls',desc:true})};
 $('#pm').onchange=()=>{roles($('#pm').value);go()};['pt','pr','pb','pq'].forEach(i=>$('#'+i).oninput=go);go()};
pages.matchups=()=>{const bs=[...new Set(D.mu.map(r=>r.batter))].sort(),bw=[...new Set(D.mu.map(r=>r.bowler))].sort();$('#page').innerHTML=`<h2>Batter vs bowler matchups</h2><p class=note>Only pairs with at least 8 balls. Shrunk SR pulls each pair toward the league average (${f(D.lg_sr,0)}). Fewer than 15 balls is exploratory only. One dismissal is not a pattern. Bowling style and handedness are not in the data.</p>
<div class=ctl><label>Batter <input id=mb list=lb placeholder="any"></label><datalist id=lb>${bs.map(x=>`<option>${x}</option>`).join('')}</datalist><label>Bowler <input id=mw list=lw placeholder="any"></label><datalist id=lw>${bw.map(x=>`<option>${x}</option>`).join('')}</datalist><label>Min balls <input id=mm type=number value=10 min=8 style="width:70px"></label></div><div id=mx></div>`;
 const go=()=>{const b=$('#mb').value.toLowerCase(),w=$('#mw').value.toLowerCase(),mn=+$('#mm').value||8;const R=D.mu.filter(r=>r.balls>=mn&&r.batter.toLowerCase().includes(b)&&r.bowler.toLowerCase().includes(w)).map(r=>({...r,sr:100*r.runs/r.balls,sr_s:(r.runs+30*D.lg_sr/100)/(r.balls+30)*100,dp:100*r.dots/r.balls,bp:100*r.bnd/r.balls,flag:r.balls<15?'exploratory':r.balls<30?'weak':'usable'}));
 table($('#mx'),R,[{k:'batter',t:'Batter'},{k:'bowler',t:'Bowler'},{k:'balls',t:'Balls'},{k:'runs',t:'Runs'},{k:'outs',t:'Dismissed'},{k:'sr',t:'SR',f:v=>f(v,0)},{k:'sr_s',t:'Shrunk SR',f:v=>f(v,0)},{k:'dp',t:'Dot %',f:v=>f(v,0)},{k:'bp',t:'Bnd %',f:v=>f(v,0)},{k:'flag',t:'Sample',f:v=>`<span class="pill ${v==='usable'?'good':'warn'}">${v}</span>`}],{sort:'balls',max:100})};
 ['mb','mw','mm'].forEach(i=>$('#'+i).oninput=go);go()};
pages.quality=()=>{$('#page').innerHTML=`<h2>Data quality</h2><p class=note>Checks run on every build. OK = nothing found. INFO = unusual but valid cricket. Nothing was fabricated or silently dropped.</p><div id=qc></div><h3>Coverage</h3><div id=qv></div><h3>Known limits</h3><ul class=pts><li>Only 64 matches: every comparison carries wide uncertainty. Win-probability models are not built on this sample.</li><li>All matches were at one ground, so venue effects cannot be studied.</li><li>No bowling style, handedness or player roles in the source: matchups and roles are inferred from usage.</li><li>Kathmandu Gorkhas (2025/26) and Kathmandu Gurkhas (2024/25) are treated as one franchise (confirmed by the user).</li><li>The 2024/25 tie was decided by a super over, which is excluded from phase statistics.</li></ul>`;
 table($('#qc'),D.quality,[{k:'check',t:'Check'},{k:'records_affected',t:'Records'},{k:'severity',t:'Status',f:v=>`<span class="pill ${v==='OK'?'good':v==='ERROR'?'bad':'warn'}">${v}</span>`},{k:'examples',t:'Examples'},{k:'recommended_correction',t:'Handling'}],{max:50});
 table($('#qv'),D.cover,[{k:'season',t:'Season'},{k:'matches',t:'Matches'},{k:'innings',t:'Innings'},{k:'deliveries',t:'Deliveries'},{k:'first',t:'First match'},{k:'last',t:'Last match'}])};
const NAV=[['overview','Overview'],['factors','Winning factors'],['teams','Teams'],['opp','Opposition'],['players','Players'],['matchups','Matchups'],['quality','Data quality']];
$('#nav').innerHTML=NAV.map(([k,l])=>`<button data-p="${k}">${l}</button>`).join('');
function show(k){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.p===k));$('#page').innerHTML='';pages[k]();history.replaceState(null,'','#'+k);window.scrollTo(0,0)}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>show(b.dataset.p));show(pages[location.hash.slice(1)]?location.hash.slice(1):'overview');
</script></body></html>
